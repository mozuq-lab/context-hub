name: 検証

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run demo
      - run: npm audit --audit-level=moderate

  # 本体の変更がFlutterクライアントの読取・書込protocolを壊さないかを、クライアントの既定ブランチで検査する。
  # クライアントの固定submoduleの代わりにこのcommitを置き、Dartテストを実行する。テストはDartが保存した依頼を本体が受理する検査を含む。
  # fixtureと本体出力の比較は、本体の出力を変えるPRでは意図した変更でも必ず差分になり、本体のmerge後までクライアント側で直せない。
  # そのため比較は失敗にせず警告と実行サマリーで示し、Dartテストからは除く。差分は本体のmerge後にクライアント側でfixtureを再生成して解消する。
  client-contract:
    runs-on: ubuntu-latest
    # Dartテストの失敗は互換性の注意としてPR上に示し、本体のmergeは止めない。
    continue-on-error: true
    timeout-minutes: 30
    env:
      FLUTTER_VERSION: '3.41.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mozuq-lab/context-hub-flutter-client
          path: client
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: client/vendor/context-hub
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: protocol検査用に本体をビルド
        working-directory: client
        # 本体の依存がクライアントのlockfileと異なっても検査できるよう、ciではなくinstallを使う。
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build:protocol
      - name: Flutterの取得
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: fixture形式の比較（参考）
        working-directory: client
        run: |
          log="$RUNNER_TEMP/fixture-drift.log"
          if node scripts/check_fixture_drift.mjs >"$log" 2>&1; then
            cat "$log"
          else
            cat "$log"
            echo "::warning title=クライアントfixtureとの形式差分::本体の出力がクライアントのfixtureと異なります。意図した変更なら、本体のmerge後にクライアントのsubmoduleを更新してfixtureを再生成してください。詳細は実行サマリーを参照してください。"
            {
              echo '### クライアントfixtureとの形式差分（参考）'
              echo
              echo '本体の出力がクライアントのfixtureと異なります。意図した変更なら、本体のmerge後にクライアントのsubmoduleをこのcommitへ更新し、fixtureを再生成してください。このPRの失敗にはしていません。'
              echo
              echo '```'
              cat "$log"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Dartテスト
        working-directory: client
        run: |
          flutter --disable-analytics
          flutter pub get
          # fixture比較は前のstepで警告として実行済みのため除く。
          mapfile -t tests < <(find test -name '*_test.dart' ! -name fixture_drift_test.dart | sort)
          if [ "${#tests[@]}" -eq 0 ]; then echo '::error::Dartテストが見つかりません'; exit 1; fi
          flutter test "${tests[@]}"
